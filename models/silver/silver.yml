version: 2

models:

  - name: silver_customer
    description: "Cleaned and deduplicated customer data"

    columns:
      - name: CUSTOMER_ID
        tests:
          - not_null
          - unique

      - name: CUSTOMER_NAME
        tests:
          - not_null

  - name: silver_product
    description: "Cleaned and deduplicated product data"

    columns:
      - name: PRODUCT_ID
        tests:
          - not_null
          - unique

      - name: PRODUCT_NAME
        tests:
          - not_null

  - name: silver_order
    description: "Cleaned and deduplicated order data"

    columns:
      - name: ORDER_ID
        tests:
          - not_null
          - unique

      - name: CUSTOMER_ID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customer')
                field: CUSTOMER_ID

      - name: PRODUCT_ID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_product')
                field: PRODUCT_ID