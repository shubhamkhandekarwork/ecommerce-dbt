version: 2

models:

  - name: dim_customer
    description: "Customer dimension"
    columns:
      - name: CUSTOMER_ID
        tests:
          - not_null

  - name: dim_product
    description: "Product dimension"
    columns:
      - name: PRODUCT_ID
        tests:
          - not_null
          - unique

  - name: fact_order
    description: "Order fact table"
    columns:
      - name: ORDER_ID
        tests:
          - not_null
          - unique

      - name: CUSTOMER_ID
        tests:
          - not_null

      - name: PRODUCT_ID
        tests:
          - not_null

  - name: dim_customer_scd2
    description: "Customer dimension with SCD Type 2 historical records"
    columns:
      - name: SCD2_KEY
        tests:
          - not_null
          - unique

      - name: CUSTOMER_ID
        tests:
          - not_null

      - name: IS_CURRENT
        tests:
          - not_null

  - name: vw_sales_customer_product
    description: "Consolidated view containing order, customer, and product information"
    columns:
      - name: ORDER_ID
        tests:
          - not_null

      - name: CUSTOMER_ID
        tests:
          - not_null

      - name: PRODUCT_ID
        tests:
          - not_null